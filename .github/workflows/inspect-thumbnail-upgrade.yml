name: Integrate v10 thumbnail upgrade
on:
  push:
    branches: [integration/dark-phys-final]
    paths:
      - 'youtube-agent-upgrade-v10.zip'
      - '.github/workflows/inspect-thumbnail-upgrade.yml'
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/dark-phys-final
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract and locate v10 package files
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v10
          unzip -q youtube-agent-upgrade-v10.zip -d /tmp/v10
          find /tmp/v10 -type f -printf '%P\t%s bytes\n' | sort
          AGENT="$(find /tmp/v10 -type f -path '*/files/agents/thumbnail-designer-agent.js' -print -quit)"
          EXTRA="$(find /tmp/v10 -type f -path '*/files/agents/thumbnail-families-extra.js' -print -quit)"
          TEST="$(find /tmp/v10 -type f -path '*/files/scripts/test-thumbnail-designer.js' -print -quit)"
          README="$(find /tmp/v10 -type f -name README_URDU.md -print -quit)"
          test -s "$AGENT" && test -s "$EXTRA" && test -s "$TEST" && test -s "$README"
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"
          echo "test=$TEST" >> "$GITHUB_OUTPUT"
          echo "readme=$README" >> "$GITHUB_OUTPUT"
      - name: Integrate the 12 additional design families
        env:
          AGENT: ${{ steps.pkg.outputs.agent }}
          EXTRA: ${{ steps.pkg.outputs.extra }}
          TEST: ${{ steps.pkg.outputs.test }}
          README: ${{ steps.pkg.outputs.readme }}
        run: |
          set -euo pipefail
          cp "$AGENT" agents/thumbnail-designer-agent.js
          cp "$EXTRA" agents/thumbnail-families-extra.js
          cp "$TEST" scripts/test-thumbnail-designer.js
          cp "$README" THUMBNAIL-DESIGNS-V10-URDU.md
          node --check agents/thumbnail-designer-agent.js
          node --check agents/thumbnail-families-extra.js
      - name: Install thumbnail render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          npm install --no-save sharp
      - name: Validate all 24 design families
        run: |
          node - <<'NODE'
          const { ThumbnailDesignerAgent, DESIGN_FAMILIES } = require('./agents/thumbnail-designer-agent');
          const agent = new ThumbnailDesignerAgent(null, {});
          if (DESIGN_FAMILIES.length !== 24) throw new Error('Expected 24 families, found ' + DESIGN_FAMILIES.length);
          const ids = new Set(DESIGN_FAMILIES.map(x => x.id));
          for (const id of ['evidence-board','neon-cyber','redacted-file','hazard-warning','duotone-poster','chat-screen','big-number','spotlight-stage','torn-paper','viewfinder','minimal-modern','vhs-glitch']) {
            if (!ids.has(id)) throw new Error('Missing v10 family: ' + id);
          }
          console.log('PASS: all 24 thumbnail families registered');
          console.log(DESIGN_FAMILIES.map(x => x.id).join(', '));
          NODE
          node scripts/test-thumbnail-designer.js
      - name: Preserve visual test contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: dark-phys-thumbnail-v10-contact-sheet
          path: uploads/thumbnails/test-run-*/
          if-no-files-found: error
          retention-days: 7
      - name: Commit integrated thumbnail upgrade
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents/thumbnail-designer-agent.js agents/thumbnail-families-extra.js scripts/test-thumbnail-designer.js THUMBNAIL-DESIGNS-V10-URDU.md
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "Integrate 12 additional v10 thumbnail design families"
            git push origin HEAD:integration/dark-phys-final
          fi
