name: Validate Dark Phys ZIP integrations
on:
  push:
    branches: [integration/dark-phys-final]
    paths:
      - 'agents/**'
      - 'scripts/**'
      - 'thumbnail-designer-agent (1).js'
      - 'utils/**'
      - '.github/workflows/validate-upgrades.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Doctor modules
        run: python -m compileall -q agents/universal-doctor
      - name: Doctor unit tests
        run: python -m unittest discover -s agents/universal-doctor/tests -v
      - name: Doctor safety self-test
        run: python agents/universal-doctor/doctor.py selftest
  node-upgrades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install FFmpeg and thumbnail dependency
        run: npm install --no-save sharp
      - name: Syntax checks
        run: |
          node --check agents/video-format-planner.js
          node --check scripts/plan-video.js
          node --check scripts/test-video-planner.js
          node --check agents/thumbnail-designer-agent.js
      - name: Video planner tests
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            node scripts/test-video-planner.js
          else
            node -e "const fs=require('fs'),os=require('os'),path=require('path'),{VideoFormatPlanner,FORMATS}=require('./agents/video-format-planner'),p=new VideoFormatPlanner({historyPath:path.join(os.tmpdir(),'dp-ci.json')}),plan=p.planVideo({title:'7 Signs You Are Being Gaslighted'},{record:false}),out=fs.mkdtempSync(path.join(os.tmpdir(),'dp-caps-')),caps=p.generateCaptions({text:'Gaslighting can make people doubt their own memory.',durationSec:6},plan,out,'ci');if(Object.keys(FORMATS).length!==6||!plan.shotPlan.length||!fs.existsSync(caps.srtPath)||!fs.existsSync(caps.assPath))process.exit(1);console.log('PASS planner and captions; FFmpeg checks skipped')"
          fi
      - name: Thumbnail designer tests
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            node scripts/test-thumbnail-designer.js
          else
            node -e "const m=require('./agents/thumbnail-designer-agent.js'); if(!m.ThumbnailDesignerAgent || m.DESIGN_FAMILIES.length<12) process.exit(1); console.log('PASS thumbnail module load and design family registry; render checks skipped (FFmpeg unavailable)')"
          fi
